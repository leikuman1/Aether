name: CI

on:
  push:
    branches: [main, worktree-m1-retrieval]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AETHER_EMBEDDING_PROVIDER: fake
      AETHER_LLM_API_KEY: ""
      AETHER_DENSE_BACKEND: sqlite-vec
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python -m aether.api.smoke --output data/bench/m3-sse.json
      - run: uv run aether-eval retrieval --gate
      - run: uv run aether-eval agent --gate
      - run: uv run python -m aether.retrieval.bench --output data/bench.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-reports-${{ matrix.os }}
          path: |
            data/bench.json
            data/bench/m3-sse.json
            data/eval/retrieval.json
            data/eval/agent.json

  answer-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AETHER_EMBEDDING_PROVIDER: fake
      AETHER_LLM_API_KEY: ""
      AETHER_DENSE_BACKEND: sqlite-vec
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Replay answer quality gate (maximum 3 minutes)
        timeout-minutes: 3
        run: >-
          uv run aether-eval answer --judge replay --gate --repeat 3
          --baseline data/golden/answer_baseline.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-answer-reports
          path: |
            data/eval/answer.json
            data/eval/answer_history.jsonl
